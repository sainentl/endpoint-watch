[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-watch"
version = "0.1.0"
description = "A small HTTP endpoint health checker with text and JSON reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sainentl"}]
dependencies = []
keywords = ["http", "healthcheck", "cli", "monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/sainentl/endpoint-watch"
Issues = "https://github.com/sainentl/endpoint-watch/issues"

[project.scripts]
endpoint-watch = "endpoint_watch.__main__:main"

[tool.setuptools.packages.find]
include = ["endpoint_watch*"]
